name: ios
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**"]

concurrency:
  # PRs: a new push cancels the stale run. main: runs queue and are never cancelled mid-run, so the full
  # UI suite on main always completes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # macos-26 image: Xcode 26.x with the iOS 26 SDK and iPhone 17 simulators
    # (verified in actions/runner-images images/macos/macos-26-arm64-Readme.md).
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      SIM_NAME: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      # PRs: build everything (UI tests included) but run only the unit tests (~5 min). The XCUITest suites
      # run locally by each screen's iOS QA on Simulators before sign-off, and in full here on every push to main.
      - name: Build and test
        working-directory: ios
        run: |
          SKIP=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then SKIP="-skip-testing:FoodWasteReducerUITests"; fi
          xcodebuild test -project FoodWasteReducer.xcodeproj -scheme FoodWasteReducer \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=26.5" CODE_SIGNING_ALLOWED=NO $SKIP
