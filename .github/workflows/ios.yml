name: ios
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**"]

jobs:
  build-and-test:
    # macos-26 image: Xcode 26.x with the iOS 26 SDK and iPhone 17 simulators
    # (verified in actions/runner-images images/macos/macos-26-arm64-Readme.md).
    runs-on: macos-26
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      SIM_NAME: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test -project FoodWasteReducer.xcodeproj -scheme FoodWasteReducer \
            -destination "platform=iOS Simulator,name=$SIM_NAME" CODE_SIGNING_ALLOWED=NO
