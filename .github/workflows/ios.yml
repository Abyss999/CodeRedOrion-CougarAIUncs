name: ios
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**"]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['name'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project FoodWasteReducer.xcodeproj -scheme FoodWasteReducer \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO
