name: pipeline
on:
  pull_request:
    paths: ["pipeline/**", "ml/yolo/**", "ml/ocr/**", "ml/serve/**", "backend/app/services/food_group.py", ".github/workflows/pipeline.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**", "ml/yolo/**", "ml/ocr/**", "ml/serve/**", "backend/app/services/food_group.py", ".github/workflows/pipeline.yml"]

concurrency:
  # PRs: a new push cancels the stale run. main: runs queue and are never cancelled mid-run, so the full
  # UI suite on main always completes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Light deps only (no torch / transformers)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r pipeline/requirements.txt flask   # flask: ml/serve integration test
      - name: Pipeline tests
        run: .venv/bin/python -m pytest pipeline/tests -q -o python_files="test_*.py qa_*.py"
