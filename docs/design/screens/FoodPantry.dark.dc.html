<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Food Pantry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px">
    <a href="Social.dark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">Food Pantry</h1>
      <p style="margin: 2px 0 0; font-size: 14px; color: #9DB09F">Shared by your friends and groups</p>
    </div>
  </header>
  <div role="tablist" aria-label="Source" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #223024; border-radius: 14px">
    <button role="tab" aria-selected="true" style="height: 40px; border: 0; border-radius: 10px; background: #18261B; color: #E8F0DA; font-weight: 600; font-size: 15px">All</button>
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #9DB09F; font-weight: 500; font-size: 15px">Friends</button>
    <button role="tab" aria-selected="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #9DB09F; font-weight: 500; font-size: 15px">Groups</button>
  </div>
  <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{listings}}" as="l" hint-placeholder-count="5">
      <li style="background: #18261B; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="{{l.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{l.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{l.icon}}"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 16px; font-weight: 600">{{l.name}}</span>
          <span style="font-size: 13px; color: #9DB09F">{{l.meta}}</span>
        </span>
        <sc-if value="{{l.claimed}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 600; color: #B9D871">Claimed</span>
        </sc-if>
        <sc-if value="{{l.open}}" hint-placeholder-val="{{ true }}">
          <button style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #B9D871; color: #13261A; font-size: 14px; font-weight: 600">Claim</button>
        </sc-if>
      </li>
    </sc-for>
  </ul>
  <p style="margin: 0; font-size: 13px; color: #9DB09F">Claiming tells the owner you'd like it. Arrange pickup with them, and they'll mark it given.</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'width: 40px; height: 40px; border-radius: 12px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; flex-shrink: 0';
const G = 'M5 11a4 4 0 0 1 1-7h12a4 4 0 0 1 1 7v9H5zM9 11v5M15 11v5';
const V = 'M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5';
const P = 'M14.5 3.5a6 6 0 0 1 6 6c0 3.3-2.7 5.4-5.6 5.9l-3.6 3.6a2.2 2.2 0 1 1-3.1-3.1l-.6-.6a2.2 2.2 0 1 1 3.1-3.1l3.6-3.6c.5-2.9 0-5.1.2-5.1z';
const J = 'M8 3h8v3H8zM7 6h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM6 11h12';
return {
listings: [
{ name: 'Sourdough, half loaf', meta: 'Theo Nguyen · use by Oct 12', icon: G, stroke: '#E8C46A', tile: tile('#33290F'), open: false, claimed: true },
{ name: 'Basil', meta: 'Moody Hall 4F · use by Oct 11', icon: V, stroke: '#8FD69A', tile: tile('#1C3320'), open: true, claimed: false },
{ name: 'Eggs, 6', meta: 'Priya R. · use by Oct 30', icon: P, stroke: '#FF9E8A', tile: tile('#3D1F1A'), open: true, claimed: false },
{ name: 'Jasmine rice, 2 lb', meta: 'CougarCS Kitchen · pantry', icon: J, stroke: '#C1AAF0', tile: tile('#2A2140'), open: true, claimed: false },
{ name: 'Bell peppers, 3', meta: 'Moody Hall 4F · use by Oct 14', icon: V, stroke: '#8FD69A', tile: tile('#1C3320'), open: true, claimed: false }
]
};
}
}
</script>
</body>
</html>
