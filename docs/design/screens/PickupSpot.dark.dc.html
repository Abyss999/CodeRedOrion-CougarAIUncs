<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Pickup spot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A110C; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="ps-title" style="background: #0F1A12; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #34483A"></div>
    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <a href="ItemDetail.dark.dc.html" style="justify-self: start; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 500">Cancel</a>
      <h2 id="ps-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px">Pickup spot</h2>
      <a href="ItemDetail.dark.dc.html" style="justify-self: end; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 16px; font-weight: 700">Done</a>
    </header>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ps-note" style="font-size: 14px; font-weight: 600; color: #C9D6BC">Note</label>
      <textarea id="ps-note" rows="2" maxlength="120" aria-describedby="ps-count" style="box-sizing: border-box; width: 100%; min-height: 76px; padding: 12px 14px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; font-family: inherit; font-size: 16px; line-height: 1.35; color: #E8F0DA; resize: none">Blue cooler by the front desk, ask for 4B</textarea>
      <span id="ps-count" style="align-self: flex-end; font-size: 13px; color: #9DB09F; font-variant-numeric: tabular-nums">41/120</span>
    </div>
    <section aria-label="Pin" style="background: #18261B; border-radius: 16px; overflow: hidden">
      <div style="height: 140px; width: 100%; border-radius: 0px; overflow: hidden; background: #223024; flex-shrink: 0"><svg width="100%" height="100%" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Apple Maps preview: pin at Moody Towers North" fill="none" stroke-linecap="round"><path d="M-10 46H330M-10 118H330M64 -10V180M184 -10V180M262 -10V180" stroke="#13261A" stroke-width="9"></path><path d="M-10 152L120 76L330 20M124 46V118M184 82H262" stroke="#13261A" stroke-width="4"></path><path d="M150 50c-11 0-20 8.6-20 19.5C130 84 150 104 150 104s20-20 20-34.5C170 58.6 161 50 150 50z" fill="#B9D871"></path><circle cx="150" cy="69" r="7" fill="#13261A"></circle></svg></div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; color: #B9D871">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600; color: #E8F0DA">Moody Towers North</span>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; color: #B9D871; font-size: 14px; font-weight: 600">Move pin</button>
      </div>
    </section>
    <section aria-labelledby="ps-saved-h" style="display: flex; flex-direction: column; gap: 8px">
      <h3 id="ps-saved-h" style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9DB09F">Use a saved spot</h3>
      <ul style="list-style: none; margin: 0; padding: 0; background: #18261B; border-radius: 16px; overflow: hidden">
        <sc-for list="{{saved}}" as="sp" hint-placeholder-count="2">
          <li><button type="button" style="{{sp.rowStyle}}">
            <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 10px; background: #24361F; color: #B9D871; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{sp.icon}}"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600; color: #E8F0DA">{{sp.name}}</span><span style="font-size: 13px; color: #9DB09F">{{sp.place}}</span></span></button></li>
        </sc-for>
      </ul>
      <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 12px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; color: #B9D871; font-size: 15px; font-weight: 600; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><span style="flex: 1">Save this spot</span></button>
    </section>
    <button type="button" style="align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: #0F1A12; color: #FFB98A; font-size: 15px; font-weight: 600">Remove pickup spot</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const row = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 8px 14px; border: 0; border-bottom: 1px solid #2A3A2D; background: #18261B; text-align: left';
const rowLast = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 8px 14px; border: 0; background: #18261B; text-align: left';
const H = 'M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z';
const B = 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M7.5 14h9';
return {
saved: [
{ name: 'Home', place: 'Cambridge Oaks, Building C', icon: H, rowStyle: row },
{ name: 'Lab', place: 'Science & Research 1, room 214', icon: B, rowStyle: rowLast }
]
};
}
}
</script>
</body>
</html>
