<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Ask for something</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #050806; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="rq-title" style="background: #0F1A12; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #34483A"></div>
    <header style="display: flex; justify-content: space-between; align-items: center">
      <a href="Social.dark.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Cancel</a>
      <h2 id="rq-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px">Ask for something</h2>
      <button style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #B9D871; color: #13261A; font-size: 15px; font-weight: 600">Post</button>
    </header>

    <div style="background: #3A3720; border-radius: 4px 4px 14px 4px; padding: 16px; box-shadow: 0 2px 6px rgba(185,216,113,0.16); display: flex; flex-direction: column; gap: 8px; transform: rotate(-0.6deg)">
      <label for="rq-text" style="font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #C9D6BC">Your note</label>
      <textarea id="rq-text" rows="3" style="border: 0; outline: none; resize: none; background: transparent; font-family: Outfit, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.3; color: #E8F0DA">Anyone have 2 eggs? Baking tonight.</textarea>
      <span style="align-self: flex-end; font-size: 12px; color: #9DB09F">36 / 280</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; color: #C9D6BC; margin-bottom: 8px">Who can see it</legend>
      <sc-for list="{{audiences}}" as="a" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{a.pressed}}" style="{{a.rowStyle}}">
          <span style="{{a.circleStyle}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{a.checkStyle}}"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600; color: #E8F0DA">{{a.name}}</span><span style="font-size: 13px; color: #9DB09F">{{a.meta}}</span></span>
        </button>
      </sc-for>
      <p style="margin: 0; font-size: 13px; color: #9DB09F">Pick at least one</p>
    </fieldset>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const row = 'width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border: 0; border-radius: 14px; background: #18261B; text-align: left; font: inherit; color: #E8F0DA; ';
const circle = 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ';
const on = { pressed: 'true', rowStyle: row + 'box-shadow: inset 0 0 0 2px #B9D871', circleStyle: circle + 'background: #B9D871', checkStyle: 'display: block' };
const off = { pressed: 'false', rowStyle: row + 'box-shadow: inset 0 0 0 1px #34483A', circleStyle: circle + 'background: #18261B; border: 2px solid #9DB09F', checkStyle: 'display: none' };
return {
audiences: [
Object.assign({ name: 'Friends', meta: '12 friends' }, on),
Object.assign({ name: 'Moody Hall 4F', meta: 'Group · 18 members' }, on),
Object.assign({ name: 'CougarCS Kitchen', meta: 'Group · 41 members' }, off)
]
};
}
}
</script>
</body>
</html>
