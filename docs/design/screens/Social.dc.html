<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
@keyframes note-drop{0%{opacity:0;transform:translateY(-12px) rotate(0deg)}70%{opacity:1}100%{opacity:1;transform:translateY(0) rotate(var(--tilt))}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){[style*="note-drop"]{animation-name:fade-in!important;animation-duration:.15s!important;animation-delay:0s!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Social</h1>
      <a href="Connect.dc.html" aria-label="Add friends or groups" style="width: 44px; height: 44px; border-radius: 22px; background: #1F4D2B; text-decoration: none; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </header>

    <a href="FoodPantry.dc.html" aria-label="Food Pantry, 7 items shared by friends and groups" style="text-decoration: none; border-radius: 20px; background: #D9EC8F; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; color: #13261A">
      <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: Outfit, sans-serif; font-size: 20px; font-weight: 600">Food Pantry</span>
          <span style="font-size: 14px; color: #2B3D30">Shared by friends and groups</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
      <span style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%">
        <sc-for list="{{pantry}}" as="p" hint-placeholder-count="3">
          <span style="min-width: 0; padding: 10px 4px 8px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px">
            <span style="{{p.tileStyle}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
            <span style="max-width: 100%; font-size: 13px; font-weight: 600; color: #13261A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
          </span>
        </sc-for>
        <span style="min-width: 0; padding: 10px 4px 8px; border-radius: 14px; background: #F4F8E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-family: Outfit, sans-serif; font-size: 20px; font-weight: 600; color: #1F4D2B">{{more}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #1F4D2B">more</span>
        </span>
      </span>
    </a>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px">Requests</h2>
      <span style="display: flex; align-items: center; gap: 4px">
        <a href="MyRequests.dc.html" aria-label="Your requests" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 15px; font-weight: 500">Yours</a>
        <a href="RequestComposer.dc.html" style="min-height: 44px; padding: 0 0 0 8px; display: flex; align-items: center; font-size: 15px; font-weight: 500">Post one</a>
      </span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
        <article style="{{n.noteStyle}}">
          <header style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: #2B3D30">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: #1F4D2B"></span>{{n.source}}</header>
          <p style="margin: 0; font-family: Outfit, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.3; color: #13261A">{{n.text}}</p>
          <footer style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #45584A">
            <span>{{n.who}}</span>
            <a href="FulfilConfirm.dc.html" aria-label="{{n.offerLabel}}" style="min-height: 44px; min-width: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; background: #1F4D2B; color: #F4F8E8; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Offer</a>
          </footer>
        </article>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Tabs" style="padding: 6px 14px 26px; box-sizing: border-box">
    <div style="height: 62px; border-radius: 31px; background: rgba(255,255,255,0.8); box-shadow: 0 8px 24px rgba(19,38,26,0.14), inset 0 0 0 1px rgba(255,255,255,0.7); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 5px">
    <a href="Home.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4F6152; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Recipes.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4F6152; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3"></path></svg>Recipes</a>
    <a href="AddSheet.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1F4D2B; font-size: 10px; font-weight: 600">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #1F4D2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add</a>
    <a href="Fridge.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #4F6152; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M6 10h12M9 5v2M9 13v3"></path></svg>Fridge</a>
    <a href="Social.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: rgba(31,77,43,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1F4D2B; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>Social</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'width: 36px; height: 36px; border-radius: 10px; background: ' + bg + '; display: flex; align-items: center; justify-content: center';
const base = 'min-height: 168px; box-sizing: border-box; padding: 14px; border-radius: 4px 4px 14px 4px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; box-shadow: 0 2px 6px rgba(31,77,43,0.12); ';
return {
pantry: [
{ name: 'Sourdough', icon: 'M5 11a4 4 0 0 1 1-7h12a4 4 0 0 1 1 7v9H5zM9 11v5M15 11v5', stroke: '#8A6414', tileStyle: tile('#F5EBCD') },
{ name: 'Basil', icon: 'M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5', stroke: '#2F7A3A', tileStyle: tile('#E2F1D8') },
{ name: 'Eggs', icon: 'M14.5 3.5a6 6 0 0 1 6 6c0 3.3-2.7 5.4-5.6 5.9l-3.6 3.6a2.2 2.2 0 1 1-3.1-3.1l-.6-.6a2.2 2.2 0 1 1 3.1-3.1l3.6-3.6c.5-2.9 0-5.1.2-5.1z', stroke: '#B0412E', tileStyle: tile('#FBE4DE') }
],
more: '+4',
notes: [
{ source: 'Moody Hall 4F', text: 'Anyone have 2 eggs? Baking tonight.', who: 'Marcus, 20m', offerLabel: 'Offer to Marcus: 2 eggs', noteStyle: base + 'background: #FFF6C7; --tilt: -1.2deg; transform: rotate(-1.2deg); animation: note-drop 0.35s cubic-bezier(.2,.8,.2,1) both' },
{ source: 'Jordan K.', text: 'Need a lemon for dinner, can trade cilantro', who: '1h', offerLabel: 'Offer to Jordan: a lemon', noteStyle: base + 'background: #E4F2C4; --tilt: 0.8deg; transform: rotate(0.8deg); animation: note-drop 0.35s cubic-bezier(.2,.8,.2,1) 50ms both' },
{ source: 'CougarCS Kitchen', text: 'Anyone have an onion? Making soup.', who: 'Dana, 2h', offerLabel: 'Offer to Dana: an onion', noteStyle: base + 'background: #E4F2C4; --tilt: 0.6deg; transform: rotate(0.6deg); animation: note-drop 0.35s cubic-bezier(.2,.8,.2,1) 100ms both' },
{ source: 'Theo Nguyen', text: 'Half a bag of shredded mozzarella?', who: '3h', offerLabel: 'Offer to Theo: shredded mozzarella', noteStyle: base + 'background: #FFF6C7; --tilt: -0.7deg; transform: rotate(-0.7deg); animation: note-drop 0.35s cubic-bezier(.2,.8,.2,1) 150ms both' }
]
};
}
}
</script>
</body>
</html>
