body{background:#0F1A12}</style>

<main style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; padding: 56px 24px 34px; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; flex-direction: column; gap: 14px">
    <a href="Main.dark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Create your account</h1>
      <p style="margin: 4px 0 0; font-size: 15px; color: #9DB09F">Start tracking what's in your fridge.</p>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 50px; border-radius: 14px; background: #18261B; border: 1px solid #8E918F; color: #E3E3E3; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>Sign up with Google</button>
  </div>

  <div role="separator" style="display: flex; align-items: center; gap: 12px; color: #9DB09F; font-size: 13px">
    <span style="flex: 1; height: 1px; background: #34483A"></span>or with email<span style="flex: 1; height: 1px; background: #34483A"></span>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #C9D6BC">Name
      <input type="text" autocomplete="name" value="Priya Raman" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; font-size: 17px; color: #E8F0DA"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #C9D6BC">Email
      <input type="email" autocomplete="email" value="priya.r@uh.edu" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #34483A; background: #18261B; font-size: 17px; color: #E8F0DA"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #C9D6BC">Password
      <span style="display: flex; align-items: center; height: 50px; box-sizing: border-box; padding: 0 6px 0 14px; border-radius: 12px; border: 2px solid #B9D871; background: #18261B">
        <input type="password" autocomplete="new-password" value="hunter2hunter" style="flex: 1; border: 0; outline: none; font-size: 17px; background: transparent; color: #E8F0DA">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
      <span style="font-size: 13px; font-weight: 400; color: #9DB09F">At least 8 characters.</span></label>
    <button type="submit" style="height: 56px; margin-top: 4px; border: 0; border-radius: 16px; background: #B9D871; color: #13261A; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Create account</button>
  </form>

  <p style="margin: auto 0 0; text-align: center; font-size: 15px; color: #9DB09F">Already have an account? <a href="LogIn.dark.dc.html" style="font-weight: 600">Log in</a></p>
</main>
