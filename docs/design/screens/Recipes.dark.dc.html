<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Recipes</h1>
      <button aria-label="New suggestions" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
    </header>

    <div role="group" aria-label="Filters" style="display: flex; gap: 8px; flex-wrap: wrap">
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #B9D871; color: #13261A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Only what I have</button>
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #B9D871; color: #13261A; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Expiring first</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; color: #E8F0DA; font-size: 14px; font-weight: 500">Under 30 min</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; color: #E8F0DA; font-size: 14px; font-weight: 500">Vegetarian</button>
    </div>

    <article style="background: #B9D871; color: #13261A; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; color: #13261A; font-weight: 600">Best match · uses 3 expiring items</span>
      <h2 style="margin: 0; font-family: Outfit, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.2">Chicken thighs with garlicky spinach and yogurt sauce</h2>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #2C4A26; color: #13261A">Chicken, today</span>
        <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #2C4A26; color: #13261A">Spinach, 1 day</span>
        <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #2C4A26; color: #13261A">Yogurt, 3 days</span>
      </div>
      <dl aria-label="Macros per serving" style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #2C4A26; border-radius: 14px; overflow: hidden">
        <sc-for list="{{macros}}" as="m" hint-placeholder-count="4">
          <div style="background: #B9D871; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px">
            <dd style="margin: 0; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600; color: #13261A">{{m.value}}</dd>
            <dt style="font-size: 11px; color: #2F4A2A">{{m.label}}</dt>
          </div>
        </sc-for>
      </dl>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #2F4A2A">
        <span>35 min · 2 servings</span>
        <a href="#" style="color: #13261A; font-weight: 600">Cook it</a>
      </div>
    </article>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px">More from your fridge</h2>
      <ul style="list-style: none; margin: 0; padding: 0; background: #18261B; border-radius: 16px">
        <sc-for list="{{more}}" as="r" hint-placeholder-count="3">
          <li style="border-bottom: 1px solid #2A3A2D">
            <a href="#" style="text-decoration: none; color: #E8F0DA; display: flex; align-items: center; gap: 12px; padding: 14px 16px">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 600">{{r.title}}</span>
                <span style="font-size: 13px; color: #9DB09F">{{r.meta}}</span>
              </span>
              <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #24361F; color: #B9D871; white-space: nowrap">{{r.uses}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>

  <nav aria-label="Tabs" style="padding: 6px 14px 26px; box-sizing: border-box">
    <div style="height: 62px; border-radius: 31px; background: rgba(24,38,27,0.82); box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 5px">
    <a href="Home.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Recipes.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: rgba(185,216,113,0.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B9D871; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3"></path></svg>Recipes</a>
    <a href="AddSheet.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B9D871; font-size: 10px; font-weight: 600">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #B9D871; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add</a>
    <a href="Fridge.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M6 10h12M9 5v2M9 13v3"></path></svg>Fridge</a>
    <a href="Social.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>Social</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
macros: [
{ value: '540', label: 'kcal' },
{ value: '46 g', label: 'protein' },
{ value: '14 g', label: 'carbs' },
{ value: '33 g', label: 'fat' }
],
more: [
{ title: 'Spinach and cheddar omelette', meta: '15 min · 410 kcal · 27 g protein', uses: 'Uses 3' },
{ title: 'Strawberry yogurt overnight oats', meta: '10 min + overnight · 380 kcal · 21 g protein', uses: 'Uses 2' },
{ title: 'Sourdough panzanella', meta: '20 min · 330 kcal · 9 g protein', uses: 'Uses 1' }
]
};
}
}
</script>
</body>
</html>
