<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add by typing or speaking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(138,59,14,.30)}100%{box-shadow:0 0 0 8px rgba(138,59,14,0)}}
@keyframes rise-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
[style*="rise-in"]{animation-name:fade-in!important;animation-duration:.15s!important;animation-delay:0s!important}
[style*="mic-pulse"]{animation:none!important;box-shadow:0 0 0 4px rgba(138,59,14,.25)!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8E978F; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="at-title" style="background: #F4F8E8; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px; height: 760px; box-sizing: border-box">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C3D1B3"></div>
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="at-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">Type or say it</h2>
      <a href="AddSheet.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #2B3D30">What did you get?
      <span style="display: flex; align-items: flex-start; gap: 8px; min-height: 96px; box-sizing: border-box; padding: 12px 8px 12px 14px; border-radius: 14px; border: 2px solid #1F4D2B; background: #FFFFFF">
        <textarea rows="3" style="flex: 1; border: 0; outline: none; resize: none; font-family: inherit; font-size: 17px; line-height: 1.4; color: #13261A; background: transparent">2 lb chicken thighs, a bag of spinach, a dozen eggs and some oat milk</textarea>
        <button type="button" aria-label="Stop listening" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #FBE3CF; display: flex; align-items: center; justify-content: center; animation: mic-pulse 1.6s ease-out infinite">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A3B0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      </span>
      <span style="font-size: 13px; font-weight: 500; color: #8A3B0E">Listening… tap the mic to stop</span></label>

    <h3 style="margin: 0; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600">We understood 4 items</h3>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border-radius: 16px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="4">
        <li style="border-bottom: 1px solid #E6EDD6; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; animation: rise-in 0.3s cubic-bezier(.2,.8,.2,1) both; animation-delay: {{i.delay}}">
          <div role="checkbox" aria-checked="{{i.checked}}" tabindex="0" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px">
            <span style="{{i.boxStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F8E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{i.tickStyle}}"><path d="M5 12l5 5L20 7"></path></svg></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 16px; font-weight: 600">{{i.name}}</span>
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px"><span style="font-size: 13px; color: #45584A">{{i.meta}}</span><span style="{{i.badgeStyle}}">{{i.when}}</span></span>
            </span>
          </div>
        </li>
      </sc-for>
    </ul>

    <a href="Fridge.dc.html" style="margin-top: auto; text-decoration: none; height: 56px; border-radius: 16px; background: #1F4D2B; color: #F4F8E8; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Add 4 items</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const soon = 'font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #EEF5D6; color: #1F4D2B; white-space: nowrap';
const box = (on) => 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #1F4D2B; border: 2px solid #1F4D2B' : 'background: transparent; border: 2px solid #45584A');
const row = (name, meta, when) => ({ name, meta, when, badgeStyle: soon, checked: 'true', boxStyle: box(true), tickStyle: 'display: block' });
const items = [
row('Chicken thighs', '2 lb · Protein', '2–3 days'),
row('Spinach', '1 bag · Veggies', '4–5 days'),
row('Eggs', '12 · Protein', '3+ weeks'),
row('Oat milk', '1 carton · Dairy', '1–2 weeks')
];
return { items: items.map((it, i) => Object.assign({ delay: (i * 40) + 'ms' }, it)) };
}
}
</script>
</body>
</html>
