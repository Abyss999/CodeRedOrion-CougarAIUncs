<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add food</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8E978F; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="add-title" style="background: #F4F8E8; border-radius: 28px 28px 0 0; padding: 10px 20px 40px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C3D1B3"></div>
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="add-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">Add food</h2>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <a href="PhotoReview.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 16px 18px; border-radius: 20px; background: #1F4D2B; color: #F4F8E8; text-align: left">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: #D9EC8F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Outfit, sans-serif; font-size: 20px; font-weight: 600">Snap your fridge</span>
        <span style="font-size: 14px; color: #C9D8BE">Every item in one photo</span>
      </span>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button style="min-height: 112px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; color: #13261A">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600">{{o.label}}</span>
            <span style="font-size: 13px; color: #45584A">{{o.hint}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
options: [
{ label: 'One item', hint: 'Checks if it\'s still good', icon: 'M12 8c-1-2-4-3-6-1-3 3-1 10 2 12 1 1 3 1 4 0 1 1 3 1 4 0 3-2 5-9 2-12-2-2-5-1-6 1zM12 8c0-2 1-3.5 3-4.5' },
{ label: 'Type or say it', hint: '"2 lb chicken, milk"', icon: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3' },
{ label: 'Barcode', hint: 'Boxes, cans, jars', icon: 'M4 5v14M7 5v14M11 5v14M14 5v14M17 5v14M20 5v14' },
{ label: 'Receipt', hint: 'Add a whole shop', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3' }
]
};
}
}
</script>
</body>
</html>
