<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove item: outcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8E978F; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="rm-title" style="position: relative; background: #F4F8E8; border-radius: 28px 28px 0 0; padding: 10px 20px 40px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C3D1B3"></div>
    <header style="display: flex; align-items: center; gap: 12px">
      <div style="position: relative; width: 48px; height: 48px; flex-shrink: 0">
        <div role="img" aria-label="Veggies" style="width: 48px; height: 48px; border-radius: 12px; background: #E2F1D8; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2F7A3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5"></path></svg>
        </div>
        <span role="img" aria-label="On your Food Pantry" style="position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; background: #1F4D2B; border: 2px solid #F4F8E8; display: flex; align-items: center; justify-content: center">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>
        </span>
      </div>
      <div style="flex: 1; min-width: 0">
        <h2 id="rm-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 22px">Baby spinach</h2>
        <p style="margin: 2px 0 0; font-size: 14px; color: #45584A">5 oz bag</p>
      </div>
      <span aria-label="Expires tomorrow" style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #FBE3CF; color: #8A3B0E; white-space: nowrap; flex-shrink: 0">Tomorrow</span>
    </header>
    <div role="group" aria-label="What happened to it?" style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border: 0; border-radius: 16px; background: #FFFFFF; color: #13261A; text-align: left; box-shadow: inset 0 0 0 1px #D3E0BF">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
        <span style="font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600">Used it</span>
      </button>
      <button aria-pressed="true" style="display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border: 0; border-radius: 16px; background: #EEF5D6; color: #13261A; text-align: left; box-shadow: inset 0 0 0 2px #1F4D2B">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #1F4D2B; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1.5S10 8 12 8zM12 8c2-4 6-4 6-1.5S14 8 12 8z"></path></svg></span>
        <span style="flex: 1; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600">Shared it</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
      </button>
      <a href="RemoveReason.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 16px; border-radius: 16px; background: #FFFFFF; color: #13261A; box-shadow: inset 0 0 0 1px #D3E0BF">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #FBE3CF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A3B0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></span>
        <span style="flex: 1; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600">Threw it away</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#45584A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>

    <div style="position: relative">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 4px 6px 4px 16px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF">
      <span id="given-label" style="font-size: 16px; color: #13261A">Given to</span>
      <button id="given-menu" aria-haspopup="menu" aria-expanded="true" aria-labelledby="given-label given-value" style="min-height: 44px; min-width: 44px; max-width: 230px; border: 0; border-radius: 10px; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 6px; color: #1F4D2B; font-size: 16px; font-weight: 600">
        <span aria-hidden="true" style="display: flex; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 11l2 2 4-4"></path></svg></span>
        <span id="given-value" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{givenTo}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg>
      </button>
    </div>

    <ul role="menu" aria-labelledby="given-label" style="position: absolute; right: 0; bottom: calc(100% + 8px); width: 248px; z-index: 2; list-style: none; margin: 0; padding: 4px 0; background: #FFFFFF; border-radius: 14px; box-shadow: 0 12px 32px rgba(19,38,26,0.22), inset 0 0 0 1px #E6EDD6">
      <sc-for list="{{people}}" as="o" hint-placeholder-count="4">
        <li role="none" style="{{o.rowStyle}}">
          <button role="menuitemradio" aria-checked="{{o.checked}}" style="width: 100%; min-height: 44px; border: 0; background: transparent; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; text-align: left; color: #13261A; font-size: 16px">
            <span style="width: 18px; display: flex; flex-shrink: 0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{o.checkStroke}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
            <span style="flex: 1; min-width: 0">{{o.name}}</span>
            <sc-if value="{{o.claimer}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Claimed it" style="display: flex; color: #1F4D2B; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 11l2 2 4-4"></path></svg></span></sc-if>
          </button>
        </li>
      </sc-for>
    </ul>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border: 0; border-radius: 14px; background: transparent; color: #1F4D2B; font-size: 16px; font-weight: 600">Cancel</button>
      <button style="height: 48px; border: 0; border-radius: 14px; background: #1F4D2B; color: #F4F8E8; font-size: 16px; font-weight: 600">Done</button>
    </div>

  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const hair = 'border-bottom: 1px solid #E6EDD6';
const p = (name, checked, rowStyle, claimer) => ({ claimer: !!claimer, name, checked: checked ? 'true' : 'false', checkStroke: checked ? '#1F4D2B' : 'transparent', rowStyle });
return {
givenTo: 'Marcus Ojeda',
people: [
p('Marcus Ojeda', true, hair, true),
p('Dana Whitfield', false, hair),
p('Theo Nguyen', false, 'border-bottom: 6px solid #E6EDD6'),
p('Someone not on BiteDown', false, 'border-bottom: 0')
]
};
}
}
</script>
</body>
</html>
