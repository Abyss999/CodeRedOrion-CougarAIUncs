<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

  </div>

  <div style="display: flex; justify-content: center; margin-top: 18px">
    <div role="img" aria-label="BiteDown" style="width: 80px; height: 80px; border-radius: 22px; background: #B9D871; display: flex; align-items: center; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19z"></path><path d="M5 19l7-7"></path></svg>

  <div style="display: flex; flex-direction: column; gap: 12px">

    <div role="separator" style="display: flex; align-items: center; gap: 12px; color: #9DB09F; font-size: 13px; margin-top: 2px">
      <span style="flex: 1; height: 1px; background: #34483A"></span>or continue with<span style="flex: 1; height: 1px; background: #34483A"></span>

      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>Continue with Google</button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { banner: { text: 'You were signed out. Log in again to pick up where you left off.' } };
}
}
</script>
</body>
</html>
