<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera access off</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8E978F; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="add-title" style="background: #F4F8E8; border-radius: 28px 28px 0 0; padding: 10px 20px 40px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C3D1B3"></div>
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="add-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">Add food</h2>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <section role="alert" aria-labelledby="denied-title" style="background: #FFFFFF; border-radius: 18px; box-shadow: inset 0 0 0 1px #D3E0BF; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: flex-start; gap: 14px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #FFF1B8; color: #6B5000; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h1M10 4h4l2 2h2a2 2 0 0 1 2 2v9M20 20H6a2 2 0 0 1-2-2V8"></path><path d="M9.5 11a3.5 3.5 0 0 0 4.9 4.6M3 3l18 18"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h3 id="denied-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 19px">Camera access is off</h3>
          <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #45584A">Turn it on in Settings to snap your fridge or scan barcodes.</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <a href="Settings.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; height: 48px; border-radius: 14px; border: 0; background: #1F4D2B; color: #F4F8E8; text-decoration: none; font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px">Open Settings</a>
        <a href="AddText.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; height: 48px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF; border: 0; color: #1F4D2B; text-decoration: none; font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px">Type it instead</a>
      </div>
    </section>

    <button type="button" disabled aria-disabled="true" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 16px; border: 0; border-radius: 18px; background: #E6EDD6; color: #45584A; text-align: left">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#45584A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      <span style="flex: 1; font-family: Outfit, sans-serif; font-size: 19px; font-weight: 600">Snap your fridge</span>
      <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #FFFFFF; color: #45584A">Off</span>
    </button>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button type="button" disabled aria-disabled="true" style="min-height: 112px; border: 0; border-radius: 18px; background: #E6EDD6; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; color: #45584A">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#45584A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg></span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
            <span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600">{{o.label}}</span>
            <span style="font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 10px; background: #FFFFFF; color: #45584A">Off</span>
          </span>
        </button>
      </sc-for>
      <a href="AddText.dc.html" style="grid-column: 1; grid-row: 1; text-decoration: none; min-height: 112px; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; color: #13261A">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600">Type or say it</span>
          <span style="font-size: 13px; color: #45584A">Voice is off: typing only</span>
        </span>
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
options: [
{ label: 'One item', icon: 'M12 8c-1-2-4-3-6-1-3 3-1 10 2 12 1 1 3 1 4 0 1 1 3 1 4 0 3-2 5-9 2-12-2-2-5-1-6 1zM12 8c0-2 1-3.5 3-4.5' },
{ label: 'Barcode', icon: 'M4 5v14M7 5v14M11 5v14M14 5v14M17 5v14M20 5v14' },
{ label: 'Receipt', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3' }
]
};
}
}
</script>
</body>
</html>
