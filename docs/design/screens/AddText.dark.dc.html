<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Add by typing or speaking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(255,185,138,.30)}100%{box-shadow:0 0 0 8px rgba(255,185,138,0)}}
@keyframes rise-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){
[style*="rise-in"]{animation-name:fade-in!important;animation-duration:.15s!important;animation-delay:0s!important}
[style*="mic-pulse"]{animation:none!important;box-shadow:0 0 0 4px rgba(255,185,138,.25)!important}}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A110C; display: flex; flex-direction: column; justify-content: flex-end">
  <section role="dialog" aria-modal="true" aria-labelledby="at-title" style="background: #0F1A12; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px; height: 760px; box-sizing: border-box">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #34483A"></div>
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h2 id="at-title" style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">Type or say it</h2>
      <a href="AddSheet.dark.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #C9D6BC">What did you get?
      <span style="display: flex; align-items: flex-start; gap: 8px; min-height: 96px; box-sizing: border-box; padding: 12px 8px 12px 14px; border-radius: 14px; border: 2px solid #B9D871; background: #18261B">
        <textarea rows="3" style="flex: 1; border: 0; outline: none; resize: none; font-family: inherit; font-size: 17px; line-height: 1.4; color: #E8F0DA; background: transparent">2 lb chicken thighs, a bag of spinach, a dozen eggs and some oat milk</textarea>
        <button type="button" aria-label="Stop listening" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: #4A2614; display: flex; align-items: center; justify-content: center; animation: mic-pulse 1.6s ease-out infinite">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      </span>
      <span style="font-size: 13px; font-weight: 500; color: #FFB98A">Listening… tap the mic to stop</span></label>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h3 style="margin: 0; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 600">We understood 4 items</h3>
      <span style="font-size: 13px; color: #9DB09F">Tap one to fix it</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; background: #18261B; border-radius: 16px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="4">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2A3A2D; animation: rise-in 0.3s cubic-bezier(.2,.8,.2,1) both; animation-delay: {{i.delay}}">
          <span style="{{i.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{i.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 600">{{i.name}}</span><span style="font-size: 13px; color: #9DB09F">{{i.meta}}</span></span>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #24361F; color: #B9D871">{{i.when}}</span>
        </li>
      </sc-for>
    </ul>

    <a href="Fridge.dark.dc.html" style="margin-top: auto; text-decoration: none; height: 56px; border-radius: 16px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Add 4 items</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'width: 36px; height: 36px; border-radius: 10px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; flex-shrink: 0';
const P = 'M14.5 3.5a6 6 0 0 1 6 6c0 3.3-2.7 5.4-5.6 5.9l-3.6 3.6a2.2 2.2 0 1 1-3.1-3.1l-.6-.6a2.2 2.2 0 1 1 3.1-3.1l3.6-3.6c.5-2.9 0-5.1.2-5.1z';
const V = 'M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5';
const D = 'M8 3h8v3l2 3v12H6V9l2-3zM6 9h12M8 6h8';
const items = [
{ name: 'Chicken thighs', meta: '2 lb · Protein · Fridge', when: '3 days', icon: P, stroke: '#FF9E8A', tile: tile('#3D1F1A') },
{ name: 'Spinach', meta: '1 bag · Veggies · Fridge', when: '5 days', icon: V, stroke: '#8FD69A', tile: tile('#1C3320') },
{ name: 'Eggs', meta: '12 · Protein · Fridge', when: '28 days', icon: P, stroke: '#FF9E8A', tile: tile('#3D1F1A') },
{ name: 'Oat milk', meta: '1 carton · Dairy · Fridge', when: '10 days', icon: D, stroke: '#9DB7F0', tile: tile('#1C2540') }
];
return { items: items.map((it, i) => Object.assign({ delay: (i * 40) + 'ms' }, it)) };
}
}
</script>
</body>
</html>
