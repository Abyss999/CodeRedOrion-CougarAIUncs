<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Item shared</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<main style="width: 390px; height: 864px; box-sizing: border-box; background: #0F1A12; padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 12px">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Fridge.dark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #B9D871; color: #13261A; font-size: 15px; font-weight: 600">Save</button>
  </header>

  <section style="display: flex; align-items: center; gap: 14px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #1C3320; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8FD69A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5"></path></svg>
    </div>
    <div style="flex: 1">
      <label for="item-name" style="display: block; font-size: 13px; color: #9DB09F">Name</label>
      <input id="item-name" type="text" value="Baby spinach" style="width: 100%; border: 0; background: transparent; font-family: Outfit, sans-serif; font-size: 26px; font-weight: 600; color: #E8F0DA; padding: 0">
    </div>
  </section>

  <div style="background: #18261B; border-radius: 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 0 16px; border-bottom: 1px solid #2A3A2D">
        <span style="font-size: 16px; color: #C9D6BC">{{r.label}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; color: #E8F0DA">{{r.value}}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
      </div>
    </sc-for>
  </div>

  <section aria-labelledby="share-heading" style="background: #18261B; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <h2 id="share-heading" style="margin: 0; display: flex; align-items: center; gap: 8px; font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600; color: #E8F0DA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C10 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C14 2 12 7 12 7z"></path></svg>On your Food Pantry</h2>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #C9D6BC">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>Shared with<b style="margin-left: auto; color: #E8F0DA">Friends</b></div>
    <div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 12px; background: #24361F; color: #B9D871; font-size: 16px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c0-4 3.4-7 7.5-7s7.5 3 7.5 7"></path></svg>Claimed by Marcus Ojeda</div>
  </section>

  <button type="button" style="width: 100%; height: 44px; border-radius: 12px; background: #18261B; border: 1px solid #34483A; color: #B9D871; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; flex-shrink: 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    Check again</button>

  <section aria-labelledby="look-heading" style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h2 id="look-heading" style="margin: 0; font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600; color: #E8F0DA">What to look for</h2>
    <ul style="margin: 0; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.4; color: #C9D6BC">
      <li>Slimy or dark wet leaves</li>
      <li>Sour or off smell</li>
      <li>Yellowing across the bag</li>
    </ul>
    <p style="margin: 0; font-size: 12px; color: #9DB09F">These are signs, not a safety guarantee.</p>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L20 7"></path></svg>Mark as given to Marcus</button>
    <button type="button" style="height: 52px; border-radius: 14px; background: #18261B; border: 1px solid #34483A; color: #B9D871; font-size: 16px; font-weight: 600">Stop sharing</button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":864}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ label: 'Quantity', value: '5 oz bag' },
{ label: 'Food group', value: 'Veggies' },
{ label: 'Stored in', value: 'Fridge' },
{ label: 'Use by', value: 'Oct 11' }
]
};
}
}
</script>
</body>
</html>
