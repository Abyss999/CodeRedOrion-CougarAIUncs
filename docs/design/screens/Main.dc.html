<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; padding: 56px 24px 34px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 10px">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #1F4D2B; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19z"></path><path d="M5 19l7-7"></path></svg>
    </div>
    <span style="font-family: Outfit, sans-serif; font-weight: 600; font-size: 18px; color: #1F4D2B">Food Waste Reducer</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; color: #13261A">Eat what<br>you buy.</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #45584A; max-width: 320px">Know what's in your fridge, use it before it turns, and see how much you kept out of the bin.</p>
  </div>

  <ul style="list-style: none; margin: 0; padding: 14px 16px; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{points}}" as="p" hint-placeholder-count="3">
      <li style="display: flex; align-items: center; gap: 14px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: Outfit, sans-serif; font-size: 17px; font-weight: 600; color: #13261A">{{p.title}}</span>
          <span style="font-size: 14px; line-height: 1.35; color: #45584A">{{p.text}}</span>
        </span>
      </li>
    </sc-for>
  </ul>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a href="SignUp.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; background: #1F4D2B; color: #F4F8E8; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Sign up</a>
    <a href="LogIn.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; background: #3B7046; color: #F4F8E8; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Log in</a>
    <div role="separator" style="display: flex; align-items: center; gap: 12px; color: #45584A; font-size: 13px; margin-top: 2px">
      <span style="flex: 1; height: 1px; background: #D3E0BF"></span>or continue with<span style="flex: 1; height: 1px; background: #D3E0BF"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button aria-label="Continue with Apple" style="height: 50px; border: 0; border-radius: 14px; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; border: 1.5px dashed #9AA39C"></span>Apple</button>
      <button aria-label="Continue with Google" style="height: 50px; border-radius: 14px; background: #FFFFFF; border: 1px solid #747775; color: #1F1F1F; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 8px; border: 1.5px dashed #747775"></span>Google</button>
    </div>
    <p style="margin: 8px 0 0; text-align: center; font-size: 13px; color: #45584A">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
points: [
{ title: 'Snap your fridge', text: 'One photo lists what you have and when each item turns.', icon: 'M4 8a2 2 0 0 1 2-2h2l2-2h4l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z' },
{ title: 'Cook what expires first', text: 'Recipes built around the food closest to going off.', icon: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h20M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3' },
{ title: 'See what you saved', text: 'Food, money and CO₂ kept out of the bin, week by week.', icon: 'M5 19c8 0 14-6 14-14C11 5 5 11 5 19zM5 19l7-7' }
]
};
}
}
</script>
</body>
</html>
