<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; padding: 56px 24px 34px; display: flex; flex-direction: column; gap: 18px">
  <header style="display: flex; flex-direction: column; gap: 14px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div>
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Create your account</h1>
      <p style="margin: 4px 0 0; font-size: 15px; color: #45584A">Start tracking what's in your fridge.</p>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="height: 50px; border: 0; border-radius: 14px; background: #000000; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600">
      <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 4px; border: 1.5px dashed #9AA39C; font-size: 9px; line-height: 15px; text-align: center; color: #9AA39C"></span>Sign up with Apple</button>
    <button style="height: 50px; border-radius: 14px; background: #FFFFFF; border: 1px solid #747775; color: #1F1F1F; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600">
      <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; border: 1.5px dashed #747775"></span>Sign up with Google</button>
  </div>

  <div role="separator" style="display: flex; align-items: center; gap: 12px; color: #45584A; font-size: 13px">
    <span style="flex: 1; height: 1px; background: #D3E0BF"></span>or with email<span style="flex: 1; height: 1px; background: #D3E0BF"></span>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #2B3D30">Name
      <input type="text" autocomplete="name" value="Priya Raman" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D3E0BF; background: #FFFFFF; font-size: 17px; color: #13261A"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #2B3D30">Email
      <input type="email" autocomplete="email" value="priya.r@uh.edu" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #D3E0BF; background: #FFFFFF; font-size: 17px; color: #13261A"></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #2B3D30">Password
      <span style="display: flex; align-items: center; height: 50px; box-sizing: border-box; padding: 0 6px 0 14px; border-radius: 12px; border: 2px solid #1F4D2B; background: #FFFFFF">
        <input type="password" autocomplete="new-password" value="hunter2hunter" style="flex: 1; border: 0; outline: none; font-size: 17px; background: transparent; color: #13261A">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#45584A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
      <span style="font-size: 13px; font-weight: 400; color: #45584A">At least 8 characters.</span></label>
    <button type="submit" style="height: 56px; margin-top: 4px; border: 0; border-radius: 16px; background: #1F4D2B; color: #F4F8E8; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Create account</button>
  </form>

  <p style="margin: auto 0 0; text-align: center; font-size: 15px; color: #45584A">Already have an account? <a href="LogIn.dc.html" style="font-weight: 600">Log in</a></p>
</main>
</x-dc>

</body>
</html>
