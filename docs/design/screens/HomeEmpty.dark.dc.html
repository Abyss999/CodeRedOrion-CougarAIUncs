<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Home empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}
body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <p style="margin: 0; font-size: 15px; color: #9DB09F">{{today}}</p>
        <h1 style="margin: 2px 0 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">{{greeting}}</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
      <a href="Settings.dark.dc.html" aria-label="Profile and settings" style="width: 44px; height: 44px; border-radius: 22px; background: #18261B; border: 1px solid #34483A; box-sizing: border-box; color: #B9D871; text-decoration: none; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.2 18.4c1.3-2 3.4-3.2 5.8-3.2s4.5 1.2 5.8 3.2"></path></svg>
      </a>
      <a href="Impact.dark.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 22px; background: #D9EC8F; color: #1F4D2B; font-weight: 600; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19z"></path></svg>
        {{saved}}
      </a>
      </div>
    </header>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px">Use these first</h2>
      <div style="background: #18261B; border-radius: 16px; padding: 20px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #24361F; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M6 10h12M9 5v2M9 13v3"></path></svg>
          </div>
          <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; color: #E8F0DA">{{useFirst.text}}</p>
        </div>
        <a href="AddSheet.dark.dc.html" style="text-decoration: none; min-width: 120px; height: 44px; padding: 0 22px; box-sizing: border-box; border-radius: 14px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 16px">Add food</a>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 20px">Cook tonight</h2>
      <div style="border-radius: 16px; padding: 18px 16px; background: #223024; border: 1px dashed #34483A; display: flex; align-items: center; gap: 12px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3"></path></svg>
        <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #9DB09F">{{cook.text}}</p>
      </div>
    </section>
  </main>

  <nav aria-label="Tabs" style="padding: 6px 14px 26px; box-sizing: border-box">
    <div style="height: 62px; border-radius: 31px; background: rgba(24,38,27,0.82); box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 5px">
    <a href="Home.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; background: rgba(185,216,113,0.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B9D871; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Recipes.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3"></path></svg>Recipes</a>
    <a href="AddSheet.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #B9D871; font-size: 10px; font-weight: 600">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #B9D871; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Add</a>
    <a href="Fridge.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M6 10h12M9 5v2M9 13v3"></path></svg>Fridge</a>
    <a href="Social.dark.dc.html" style="text-decoration: none; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8FA391; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>Social</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { today: 'Friday, Oct 10', greeting: 'Hi, Priya', saved: '0 lb saved', useFirst: { text: "Add food and we'll show what to use first" }, cook: { text: "Recipes appear once you've added a few items" } };
}
}
</script>
</body>
</html>
