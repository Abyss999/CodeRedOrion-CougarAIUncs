<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Profile and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 16px">
  <header style="display: flex; align-items: center; gap: 10px">
    <a href="Home.dark.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9D871" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 26px">Profile</h1>
  </header>

  <section style="background: #18261B; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <span style="width: 52px; height: 52px; border-radius: 26px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-size: 20px; font-weight: 600">PR</span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Priya Raman</span><span style="font-size: 14px; color: #9DB09F">priya.r@uh.edu · signed in with Google</span></span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 6px">
    <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9DB09F">Preferences</h2>
    <div style="background: #18261B; border-radius: 16px">
      <sc-for list="{{prefs}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #2A3A2D">
          <span style="font-size: 16px">{{p.label}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; color: #9DB09F">{{p.value}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9DB09F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 6px">
    <h2 style="margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9DB09F">Account</h2>
    <div style="background: #18261B; border-radius: 16px">
      <button style="width: 100%; min-height: 52px; padding: 0 16px; border: 0; border-bottom: 1px solid #2A3A2D; background: transparent; text-align: left; font-size: 16px; color: #B9D871; font-weight: 600">Sign out</button>
      <button style="width: 100%; min-height: 52px; padding: 0 16px; border: 0; background: transparent; text-align: left; font-size: 16px; color: #FFB98A; font-weight: 600">Delete account…</button>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.4; color: #9DB09F">Deleting your account removes your food, friends and groups. Your past impact stays in totals anonymously.</p>
  </section>

  <p style="margin: auto 0 0; text-align: center; font-size: 12px; color: #9DB09F">BiteDown 0.1.0</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { prefs: [ { label: 'Units', value: 'US (lb, oz)' }, { label: 'Default storage', value: 'Fridge' }, { label: 'Currency', value: 'USD' } ] };
}
}
</script>
</body>
</html>
