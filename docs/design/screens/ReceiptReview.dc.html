<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review receipt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; gap: 10px">
      <a href="AddSheet.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D3E0BF; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4D2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <div>
        <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 24px">Kroger receipt</h1>
        <p style="margin: 2px 0 0; font-size: 14px; color: #45584A">7 food items · non-food lines skipped</p>
      </div>
    </header>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border-radius: 16px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="7">
        <li style="border-bottom: 1px solid #E6EDD6">
          <label style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 44px">
            <input type="checkbox" checked="{{l.checked}}" style="width: 22px; height: 22px; accent-color: #1F4D2B; margin: 0; flex-shrink: 0">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 16px; font-weight: 600">{{l.name}}</span>
              <span style="font-size: 12px; color: #45584A; font-family: ui-monospace, SFMono-Regular, Menlo, monospace">{{l.raw}}</span>
            </span>
            <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.price}}</span>
          </label>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 0; font-size: 13px; color: #45584A">We matched each line to a food. Tap a line to fix the name, amount or group.</p>
  </main>
  <footer style="padding: 12px 20px 34px; border-top: 1px solid #E6EDD6; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #45584A">Receipt total</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">$38.42</span></div>
    <a href="Fridge.dc.html" style="text-decoration: none; height: 56px; border-radius: 16px; background: #1F4D2B; color: #F4F8E8; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">Add 6 items</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
lines: [
{ name: 'Whole milk, 1 gal', raw: 'KRO WHL MLK GAL   3.49', price: '$3.49', checked: true },
{ name: 'Large eggs, 12', raw: 'LG EGGS 12CT       2.99', price: '$2.99', checked: true },
{ name: 'Chicken thighs, 1.4 lb', raw: '1.40 lb @ 3.49/lb  4.89', price: '$4.89', checked: true },
{ name: 'Baby spinach', raw: 'ORG BBY SPINACH    3.99', price: '$3.99', checked: true },
{ name: 'Bananas, 5', raw: 'BANANAS            1.12', price: '$1.12', checked: true },
{ name: 'Sourdough loaf', raw: 'PRV SRDGH LOAF     4.29', price: '$4.29', checked: true },
{ name: 'Paper towels', raw: 'BTY PPR TWL 6R    11.99', price: '$11.99', checked: false }
]
};
}
}
</script>
</body>
</html>
