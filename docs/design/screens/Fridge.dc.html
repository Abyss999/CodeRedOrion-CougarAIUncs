<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fridge and pantry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#13261A}
a{color:#1F4D2B}a:hover{color:#13261A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F8E8; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Your food</h1>
      <span style="font-size: 15px; color: #45584A">23 items</span>
    </header>

    <div role="tablist" aria-label="Storage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E3EDCB; border-radius: 14px">
      <button role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 10px; background: #FFFFFF; color: #13261A; font-weight: 600; font-size: 15px">Fridge</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 10px; background: transparent; color: #45584A; font-weight: 500; font-size: 15px">Pantry</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 10px; background: transparent; color: #45584A; font-weight: 500; font-size: 15px">Freezer</button>
    </div>

    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #D3E0BF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#45584A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search your food</span>
      <input type="search" placeholder="Search" style="flex: 1; border: 0; outline: none; font-size: 16px; background: transparent; color: #13261A">
    </label>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8A3B0E">Expiring soon</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6EDD6">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; color: #1F4D2B">C</div>
          <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Chicken thighs</div><div style="font-size: 13px; color: #45584A">1.4 lb · added Oct 7</div></div>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #FBE3CF; color: #8A3B0E">Today</span>
        </div>
        <div style="display: flex; border-bottom: 1px solid #E6EDD6">
          <div style="flex: 1; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-left: -96px; background: #FFFFFF">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; color: #1F4D2B">S</div>
            <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Baby spinach</div><div style="font-size: 13px; color: #45584A">5 oz bag · added Oct 4</div></div>
            <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #FBE3CF; color: #8A3B0E">1 day</span>
          </div>
          <a href="RemoveSheet.dc.html" style="width: 96px; flex-shrink: 0; background: #1F4D2B; color: #F4F8E8; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Remove</a>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; color: #1F4D2B">S</div>
          <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Strawberries</div><div style="font-size: 13px; color: #8A3B0E; font-weight: 500">Photo check: looks spoiled</div></div>
          <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #FBE3CF; color: #8A3B0E">Check</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #45584A">Later</h2>
      <div style="background: #FFFFFF; border-radius: 16px">
        <sc-for list="{{later}}" as="item" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #E6EDD6">
            <div style="width: 40px; height: 40px; border-radius: 12px; background: #EEF5D6; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; color: #1F4D2B">{{item.initial}}</div>
            <div style="flex: 1"><div style="font-size: 16px; font-weight: 600">{{item.name}}</div><div style="font-size: 13px; color: #45584A">{{item.meta}}</div></div>
            <span style="font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #EEF5D6; color: #1F4D2B">{{item.when}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Tabs" style="height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E6EDD6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 8px">
    <a href="Home.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5C6E5F; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="#" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5C6E5F; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"></path><path d="M2 10h20"></path><path d="M9 7c0-1.2 1-1.8 1-3M14 7c0-1.2 1-1.8 1-3"></path></svg>Recipes</a>
    <a href="AddSheet.dc.html" aria-label="Add food" style="text-decoration: none; justify-self: center; margin-top: -26px; width: 60px; height: 60px; border-radius: 30px; background: #1F4D2B; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(31,77,43,0.28)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D9EC8F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Fridge.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #1F4D2B; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M6 10h12M9 5v2M9 13v3"></path></svg>Fridge</a>
    <a href="Social.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5C6E5F; font-size: 10px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.8 3.5 6"></path></svg>Social</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
later: [
{ initial: 'O', name: 'Oat milk', meta: '64 oz carton · opened', when: '6 days' },
{ initial: 'E', name: 'Eggs', meta: 'Dozen, 8 left', when: '12 days' },
{ initial: 'C', name: 'Sharp cheddar', meta: '8 oz block', when: '19 days' }
]
};
}
}
</script>
</body>
</html>
