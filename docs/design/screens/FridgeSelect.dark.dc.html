<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: Fridge select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#E8F0DA}
a{color:#B9D871}a:hover{color:#E8F0DA}

body{background:#0F1A12}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1A12; display: flex; flex-direction: column">
  <main style="flex: 1; overflow: hidden; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em">Your food</h1>
      <span role="status" style="margin-left: auto; margin-right: 10px; font-size: 15px; font-weight: 600; color: #9DB09F">3 selected</span>
      <button type="button" style="height: 44px; min-width: 64px; padding: 0 18px; border: 0; border-radius: 22px; background: #18261B; box-shadow: inset 0 0 0 1px #34483A; color: #B9D871; font-size: 16px; font-weight: 600">Done</button>
    </header>
    <div role="tablist" aria-label="Storage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #223024; border-radius: 14px">
      <button role="tab" aria-selected="true" style="height: 36px; border: 0; border-radius: 10px; background: #18261B; color: #E8F0DA; font-weight: 600; font-size: 15px">Fridge</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 10px; background: transparent; color: #9DB09F; font-weight: 500; font-size: 15px">Pantry</button>
      <button role="tab" aria-selected="false" style="height: 36px; border: 0; border-radius: 10px; background: transparent; color: #9DB09F; font-weight: 500; font-size: 15px">Freezer</button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9DB09F">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg>
          {{g.name}}<span style="font-weight: 500; letter-spacing: 0; text-transform: none">· {{g.count}}</span></h2>
        <div style="background: #18261B; border-radius: 16px; overflow: hidden">
          <sc-for list="{{g.items}}" as="item" hint-placeholder-count="2">
            <div style="display: flex; align-items: stretch; border-bottom: 1px solid #2A3A2D; background: {{item.rowBg}}">
              <button type="button" role="checkbox" aria-checked="{{item.checked}}" aria-label="{{item.label}}" style="width: 52px; flex-shrink: 0; border: 0; background: {{item.leadBg}}; display: flex; align-items: center; justify-content: center">
                <span style="{{item.boxStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#13261A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{item.tickStyle}}"><path d="M5 12l5 5L20 7"></path></svg></span></button>
              <div style="{{item.rowStyle}}">
                <div style="{{g.tileStyle}}">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg>
                </div>
                <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 600">{{item.name}}</div><div style="font-size: 13px; color: #9DB09F">{{item.meta}}</div></div>
                <span style="{{item.badgeStyle}}">{{item.when}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>

  <div role="toolbar" aria-label="Actions for 3 selected items" style="padding: 6px 14px 26px; box-sizing: border-box">
    <div style="border-radius: 28px; background: rgba(24,38,27,0.82); box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px">
      <button type="button" style="height: 52px; border: 0; border-radius: 16px; background: #B9D871; color: #13261A; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5L20 7"></path></svg>Used them</button>
      <button type="button" style="height: 52px; border-radius: 16px; background: #18261B; border: 1px solid #34483A; color: #B9D871; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Outfit, sans-serif; font-weight: 600; font-size: 17px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C10 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C14 2 12 7 12 7z"></path></svg>Shared them</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ICON = {
protein: 'M14.5 3.5a6 6 0 0 1 6 6c0 3.3-2.7 5.4-5.6 5.9l-3.6 3.6a2.2 2.2 0 1 1-3.1-3.1l-.6-.6a2.2 2.2 0 1 1 3.1-3.1l3.6-3.6c.5-2.9 0-5.1.2-5.1z',
veggies: 'M7 17l-3 3M15.5 8.5l-8 8c-1.4-1.4-1.4-3.6 0-5l3-3c1.4-1.4 3.6-1.4 5 0zM15.5 8.5c.8-2.2 2.7-3.5 5-3.5M15.5 8.5c2.2-.8 3.5-2.7 3.5-5',
fruit: 'M12 8c-1-2-4-3-6-1-3 3-1 10 2 12 1 1 3 1 4 0 1 1 3 1 4 0 3-2 5-9 2-12-2-2-5-1-6 1zM12 8c0-2 1-3.5 3-4.5',
dairy: 'M8 3h8v3l2 3v12H6V9l2-3zM6 9h12M8 6h8'
};
const tile = (bg) => 'width: 40px; height: 40px; border-radius: 12px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; flex-shrink: 0';
const COLOR = {
protein: { stroke: '#FF9E8A', tileStyle: tile('#3D1F1A') },
veggies: { stroke: '#8FD69A', tileStyle: tile('#1C3320') },
fruit: { stroke: '#F59AC6', tileStyle: tile('#3A1C2B') },
dairy: { stroke: '#9DB7F0', tileStyle: tile('#1C2540') }
};
const urgent = 'font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #4A2614; color: #FFB98A; white-space: nowrap';
const soon = 'font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #24361F; color: #B9D871; white-space: nowrap';
const warn = 'font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: #3A3112; color: #FFD970; white-space: nowrap';
const rowBase = 'flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 0';
const box = (on) => 'width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #B9D871; border: 2px solid #B9D871' : 'background: transparent; border: 2px solid #9DB09F');
const it = (name, m, when, on, badge) => ({ name, meta: m, when, badgeStyle: badge || soon, rowStyle: rowBase, rowBg: on ? '#EEF5D6' : '#FFFFFF', leadBg: 'transparent', checked: on ? 'true' : 'false', label: 'Select ' + name, boxStyle: box(on), tickStyle: on ? 'display: block' : 'display: none' });
return {
groups: [
{ name: 'Protein', icon: ICON.protein, stroke: COLOR.protein.stroke, tileStyle: COLOR.protein.tileStyle, count: 2, items: [
it('Chicken thighs', '1.4 lb', 'Today', true, urgent),
it('Eggs', '8 left', '1–2 weeks', false)
]},
{ name: 'Veggies', icon: ICON.veggies, stroke: COLOR.veggies.stroke, tileStyle: COLOR.veggies.tileStyle, count: 2, items: [
it('Baby spinach', '5 oz bag', 'Tomorrow', true, urgent),
it('Carrots', '2 lb bag', '2–3 weeks', false)
]},
{ name: 'Fruit', icon: ICON.fruit, stroke: COLOR.fruit.stroke, tileStyle: COLOR.fruit.tileStyle, count: 2, items: [
it('Strawberries', '1 lb box', 'Looks off', true, urgent),
it('Bananas', '5 left', 'Use soon', false, warn)
]},
{ name: 'Dairy', icon: ICON.dairy, stroke: COLOR.dairy.stroke, tileStyle: COLOR.dairy.tileStyle, count: 2, items: [
it('Greek yogurt', '32 oz tub', '2–3 days', false),
it('Oat milk', '64 oz', '6–7 days', false)
]}
]
};
}
}
</script>
</body>
</html>
