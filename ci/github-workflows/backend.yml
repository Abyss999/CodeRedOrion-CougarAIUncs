name: backend
on:
  pull_request:
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: fwr
          POSTGRES_PASSWORD: fwr
          POSTGRES_DB: fwr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fwr" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://fwr:fwr@localhost:5432/fwr_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt
      - name: pytest
        working-directory: backend
        run: ../.venv/bin/pytest -q
