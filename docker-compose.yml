# Local stack: Flask API + TimescaleDB (Postgres with the Timescale extension).
# Both ports bind to loopback only. Values come from .env (see .env.example).
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      # On first init the Timescale image restarts postgres once after tuning;
      # without a grace period that restart reads as a failed dependency.
      start_period: 30s

  api:
    build: ./backend
    env_file: .env
    environment:
      # Inside the compose network the DB is "db:5432", not localhost:5433.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_PORT:-5055}:5055"
    depends_on:
      db:
        condition: service_healthy

  # Optional YOLO detection service (ml/serve, docs/ML.md section 6). Off by default:
  #   docker compose --profile ml up -d --build   and set ML_SERVICE_URL=http://ml:8000 in .env.
  # No host port: only containers on this network (the api) can reach it. Weights are mounted read-only
  # from ML_MODELS_DIR (detector.pt + freshness.pt). Receipt OCR stays off (/ocr -> 503, the api returns its 502).
  ml:
    profiles: ["ml"]
    build:
      context: ./ml
      dockerfile: serve/Dockerfile
    environment:
      DETECTOR_BACKEND: yolo
      YOLO_WEIGHTS: /models/detector.pt
      FRESHNESS_WEIGHTS: /models/freshness.pt
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      OCR_BACKEND: "off"
      YOLO_CONFIG_DIR: /tmp/ultralytics
    volumes:
      # Long syntax with create_host_path: false, so a missing weights folder stops `up` instead of mounting an
      # empty dir (the service would then answer 500 and every photo would silently fall back to Gemini; ML-70).
      # The default is relative to this file, i.e. right for the main checkout; set ML_MODELS_DIR (absolute) elsewhere.
      - type: bind
        source: ${ML_MODELS_DIR:-../mldata/models/current}
        target: /models
        read_only: true
        bind:
          create_host_path: false

volumes:
  db-data:
